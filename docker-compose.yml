services:
  app-casa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-casa-be
    ports:
      - "8080:8080"
    networks:
      - net-app-casa

  postgres-db:
    image: postgres:latest
    container_name: app-casa-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=app_casa_db
    ports:
      - "5432:5432"
    networks:
      - net-app-casa

networks:
  net-app-casa:
    name: net-app-casa
    driver: bridge